name = "kd_adadualfocal_seed42"
output_dir = "runs/cifar10-adaptive-focal"

[data]
source = "cifar10"
root = "data"
num_classes = 10
image_size = 32
horizontal_flip = true
validation_fraction = 0.1
split_seed = 2026

[student]
name = "cifar_student"

[teacher]
name = "cifar_teacher"
checkpoint = "runs/cifar10/teacher/student.pt"

[distillation]
method = "kd"
temperature = 4.0
weight = 0.5
warmup_epochs = 5

[supervised_loss]
method = "adadualfocal"
bins = 15
update_rate = 1.0
gamma_min = -2.0
gamma_max = 20.0
switch_threshold = 0.2

[train]
epochs = 20
batch_size = 128
learning_rate = 0.05
momentum = 0.9
weight_decay = 0.0005
workers = 0
threads = 4
device = "mps"
seed = 42

[benchmark]
warmup = 20
iterations = 100
