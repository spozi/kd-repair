[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-autonomous-car"
version = "0.1.0"
description = "Reproducible computer-vision knowledge distillation experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.24", "Pillow>=10", "scipy>=1.11"]

[project.optional-dependencies]
reports = ["matplotlib>=3.8"]

[project.scripts]
kd = "kd.cli:main"

[tool.setuptools.packages.find]
include = ["kd*"]

[tool.setuptools.package-data]
kd = ["catalog/*.json"]
